name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch all history for proper tag information

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: "yarn"

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run validation
        run: yarn validate

      - name: Run tests
        run: yarn test

      - name: Build package
        run: yarn build

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        id: release_notes
        run: |
          # Extract tag message
          TAG_MESSAGE=$(git tag -l --format='%(contents)' ${{ github.ref_name }})

          # Create release notes
          cat << EOF > release_notes.md
          ## Release ${{ github.ref_name }}

          $TAG_MESSAGE

          ### Installation

          Install this version using:
          \`\`\`bash
          yarn add "git+https://github.com/wavicle-limechat/web-widget-react-native.git#${{ github.ref_name }}" --production
          \`\`\`

          Or with npm:
          \`\`\`bash
          npm install "git+https://github.com/wavicle-limechat/web-widget-react-native.git#${{ github.ref_name }}" --only=production
          \`\`\`

          ### What's Included

          - ✅ Pre-built JavaScript files (dist/)
          - ✅ TypeScript definitions (index.d.ts)
          - ✅ Source files for debugging (src/)
          - ✅ Complete documentation
          - ❌ Development dependencies excluded
          - ❌ Test files excluded
          EOF

          echo "RELEASE_NOTES<<EOF" >> $GITHUB_OUTPUT
          cat release_notes.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref_name }}
          release_name: Release ${{ github.ref_name }}
          body: ${{ steps.release_notes.outputs.RELEASE_NOTES }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }} # Mark as prerelease if tag contains hyphen (e.g., v1.0.0-beta.1)

      - name: Notify success
        run: |
          echo "✅ Release ${{ github.ref_name }} created successfully!"
          echo "🔗 Clients can install with: yarn add \"git+https://github.com/wavicle-limechat/web-widget-react-native.git#${{ github.ref_name }}\" --production"
